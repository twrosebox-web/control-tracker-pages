<style>
:root{--ink:#1e293b;--muted:#64748b;--line:#dbe3ea;--paper:#f7f8fb;--panel:#fff;--brand:#9b3d6a;--brand-soft:#fff1f6;--teal:#0f766e;--teal-soft:#ecfdf5;--amber:#b45309;--amber-soft:#fff7ed;--rose:#be123c;--rose-soft:#fff1f2;--blue:#1d4ed8;--blue-soft:#eff6ff;--shadow:0 12px 28px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}
aside{background:#202939;color:#e7edf6;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:8px 10px 22px}.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#f3c1d5;color:#531530;font-weight:900}.brand strong{display:block;font-size:15px}.brand small{color:#aebbd0}.nav-group{margin:12px 0}.nav-label{font-size:10px;letter-spacing:.12em;color:#94a3b8;padding:0 10px;margin:14px 0 5px}.nav{width:100%;text-align:left;color:#d9e2ef;background:transparent;border:0;border-radius:8px;padding:9px 10px;margin:2px 0;font:inherit;cursor:pointer}.nav:hover,.nav.active{background:#3a475d;color:#fff}.nav.active{box-shadow:inset 3px 0 0 #f4a7c8}.side-actions{border-top:1px solid #465268;margin-top:18px;padding-top:12px}.side-actions button{width:100%;margin:3px 0}
main{min-width:0}.topbar{min-height:72px;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.topbar h1{font-size:20px;margin:0}.topbar p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.top-actions .btn{padding:7px 9px}.mobile-nav-toggle,.v6-mobile-more,.v6-mobile-actions-panel{display:none}.content{padding:24px 28px 48px;max-width:1600px;margin:auto}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(15,23,42,.025)}.card h2,.card h3{margin:0}.card h2{font-size:16px}.card h3{font-size:14px}.section-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:22px 0 10px}.section-head:first-child{margin-top:0}.section-head small{color:var(--muted)}.stat{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}.stat strong{display:block;font-size:27px;line-height:1.1;margin-bottom:5px}.stat span{font-size:12px;color:var(--muted)}.stat.rose{border-color:#fecdd3;background:var(--rose-soft)}.stat.amber{border-color:#fed7aa;background:var(--amber-soft)}.stat.teal{border-color:#a7f3d0;background:var(--teal-soft)}.stat.blue{border-color:#bfdbfe;background:var(--blue-soft)}
button{font:inherit}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}.btn:hover{background:#f8fafc}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:#7f2853}.btn.ghost{background:transparent}.btn.danger{color:var(--rose);border-color:#fecdd3}.btn.small{padding:4px 8px;font-size:12px}.btn.icon{padding:4px 7px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:9px;padding:12px;background:#fff}.item:hover{border-color:#b8c5d5}.clickable{cursor:pointer}.title-line{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.title-line strong{font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.empty{color:var(--muted);text-align:center;padding:26px;border:1px dashed var(--line);border-radius:10px;background:#fff}.tag{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:2px 7px;font-size:11px;font-weight:700;background:#eef2f7;color:#475569}.tag.rose{background:#ffe4e6;color:#be123c}.tag.amber{background:#ffedd5;color:#b45309}.tag.teal{background:#d1fae5;color:#047857}.tag.blue{background:#dbeafe;color:#1d4ed8}.tag.brand{background:#fce7f3;color:#9b3d6a}.tag.gray{background:#eef2f7;color:#475569}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.progress{height:6px;border-radius:8px;background:#e8edf3;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--teal)}.attention{border-left:4px solid var(--amber)}.attention.critical{border-left-color:var(--rose)}.attention.ok{border-left-color:var(--teal)}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th{background:#f8fafc;text-align:left;color:#64748b;font-size:11px;letter-spacing:.04em}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#fbfdff}.view-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.view-tab{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;font-size:12px}.view-tab.active{background:var(--ink);border-color:var(--ink);color:#fff}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:4px}.dot.good{background:var(--teal)}.dot.warn{background:#f59e0b}.dot.bad{background:#e11d48}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.open{display:flex}.modal{width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:20px}.modal.wide{width:min(1040px,100%)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.modal-head h2{font-size:18px;margin:0}.modal-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.field{margin-bottom:12px}.field label{display:block;color:#475569;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:8px 9px;background:#fff;color:var(--ink);font:inherit}.field textarea{min-height:84px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.form-grid .full{grid-column:1/-1}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.checks{display:flex;gap:7px;flex-wrap:wrap}.check{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;font-size:12px}.check input{accent-color:var(--brand);margin-right:5px}.html-preview{width:100%;height:350px;border:1px solid var(--line);border-radius:8px;background:#fff}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notice{padding:10px 12px;background:var(--amber-soft);border:1px solid #fed7aa;color:#92400e;border-radius:8px;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;z-index:30;background:#1e293b;color:#fff;border-radius:9px;padding:10px 14px;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}.toast.show,.toast.persist{transform:translateY(0);opacity:1}.hide{display:none!important}
@media(max-width:1000px){.shell{grid-template-columns:1fr}aside{position:sticky;top:0;z-index:15;height:auto;padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;overflow:visible}.brand{padding:3px 5px}.brand small{display:none}.mobile-nav-toggle{display:inline-flex;margin-left:auto;color:#fff;border-color:#64748b;background:#334155}aside>.nav-group,aside>.side-actions{display:none}aside.mobile-nav-open>.nav-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;width:100%;margin:0;padding-top:6px;border-top:1px solid #465268}aside.mobile-nav-open>.side-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;width:100%;margin:0;padding-top:8px}.nav-label{display:block;grid-column:1/-1;margin:6px 0 2px;padding:0 5px}.nav{width:100%;min-width:0;margin:0;padding:8px;text-align:left;white-space:normal}.side-actions button{margin:0}.topbar{position:static;padding:14px 16px}.content{padding:18px 16px}.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:1fr 1fr}}@media(max-width:640px){.topbar{align-items:flex-start;flex-direction:column;gap:10px}.grid.two,.grid.three,.grid.four,.split,.form-grid{grid-template-columns:1fr}.content{padding:14px}.modal{padding:16px}.top-actions{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:stretch}.top-actions>.btn{min-width:0}.top-actions>.btn:not(#v6CloudButton):not(#v6IntakeTop):not(#v6MobileMore){display:none}#v6CloudButton{overflow:hidden;text-overflow:ellipsis;font-size:0}#v6CloudButton::after{content:attr(data-mobile-label);font-size:12px}#v6IntakeTop,#v6MobileMore{padding-left:8px;padding-right:8px}.v6-mobile-more{display:block}.v6-mobile-actions-panel{grid-column:1/-1}.v6-mobile-actions-panel.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding-top:2px}.v6-mobile-actions-panel .btn{width:100%;white-space:normal}.stat strong{font-size:24px}}@media(max-width:380px){aside.mobile-nav-open>.nav-group,aside.mobile-nav-open>.side-actions,.v6-mobile-actions-panel.open{grid-template-columns:1fr}}
</style>

<body>
<div class="shell">
<aside id="mainNav">
  <div class="brand"><div class="brand-mark">CO</div><div><strong>Creative Ops</strong><small>美編工作與知識工作台</small></div></div>
  <button class="btn mobile-home-button" id="mobileHomeButton" onclick="app.goHome()">⌂ 首頁</button>
  <button class="btn mobile-nav-toggle" id="mobileNavToggle" onclick="app.toggleMobileNav()" aria-expanded="false" aria-controls="mainNav">☰ 功能選單</button>
  <div class="nav-group"><div class="nav-label">每日工作</div><button class="nav active" data-view="dashboard">▦　首頁控制台</button><button class="nav" data-view="tasks">◷　我的工作</button><button class="nav" data-view="work">▤　專案</button><button class="nav" data-view="confirmations">✓　確認中心</button><button class="nav" onclick="app.openRoutines()">↻　例行與提醒</button><button class="nav" data-view="events">▧　擺攤／節慶／年度</button></div>
  <div class="nav-group"><div class="nav-label">製作與網站</div><button class="nav" data-view="websites">⌘　官網營運中心</button><button class="nav" onclick="productApp.open()">▣　產品規格庫</button><button class="nav" onclick="printApp.open()">▦　印製工單中心</button><button class="nav" data-view="files">▤　檔案收集箱</button><button class="nav" data-view="sops">☷　SOP 流程庫</button></div>
  <div class="nav-group"><div class="nav-label">可傳承知識</div><button class="nav" data-view="knowledge">✦　經驗收集與整理</button><button class="nav" data-view="vendors">♜　廠商知識庫</button></div>
  <div class="side-actions"><button class="btn" onclick="eventSeedApp.createReminders()">↻ 建立近期活動提醒</button><button class="btn" onclick="app.exportData()">↓ 匯出備份</button><button class="btn" onclick="app.openImport()">↑ 匯入資料</button></div>
</aside>
<main>
  <header class="topbar"><div><h1 id="pageTitle">首頁控制台</h1><p id="pageSub">今天先掌握需要推進、確認與收尾的事情。</p></div><div class="top-actions"><button class="btn" id="topCapture" onclick="app.openCapture()">＋ 隨手記錄</button></div></header>
  <section class="content" id="content"></section>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script src="creative-ops-data.js"></script>
<script src="creative-ops-print-seed.js"></script>
<script>
const app=(()=>{
const KEY='creative_ops_v6_data';
const LEGACY_KEYS=['creative_ops_v2_data'];
const SEED=window.CREATIVE_OPS_SEED||{events:[],products:[]};
const today=()=>new Date(Date.now()+8*3600000).toISOString().slice(0,10);
const id=p=>`${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateAdd=(date,n)=>{const d=new Date(`${date}T12:00:00`);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const monthAdd=(date,n)=>{const [y,m,d]=String(date).split('-').map(Number),first=new Date(Date.UTC(y,m-1+n,1)),last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();first.setUTCDate(Math.min(d,last));return first.toISOString().slice(0,10)};
const days=d=>d?Math.round((new Date(`${d}T12:00:00`)-new Date(`${today()}T12:00:00`))/86400000):null;
const fmt=d=>d?`${d.slice(5,7)}/${d.slice(8,10)}`:'未設定';
const defaults=()=>({version:2,updatedAt:new Date().toISOString(),settings:{workspaceName:'Creative Ops',assistantConfig:{autoApplySafe:false,proactiveDaily:true}},projects:[],tasks:[],confirmations:[],routines:[],events:SEED.events.map(x=>({...x})),products:SEED.products.map(x=>({...x})),printRecords:[],printItems:[],printWorkOrders:[],printInspections:[],websites:[{id:'site_a',name:'官網 A',url:'',platform:'可編輯 HTML 區塊',status:'active',note:'長期營運網站，請填入後台與預覽資訊。'},{id:'site_b',name:'官網 B',url:'',platform:'可編輯 HTML 區塊',status:'active',note:'長期營運網站，請填入後台與預覽資訊。'}],websiteChanges:[],vendors:[],knowledge:[],sops:[],files:[],financeRecords:[],attendanceRecords:[],focusSessions:[],assistantMemory:[],assistantRuns:[],assistantSuggestions:[],assistantPlanningSessions:[],deletedSeeds:[],activity:[]});
let db=load(),view='dashboard',lastSaveError='',lastSaveFailureAt=0,modalBusyReason='',modalOperationId=0;
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){for(const oldKey of LEGACY_KEYS){const legacy=localStorage.getItem(oldKey);if(legacy){raw=legacy;localStorage.setItem(KEY,legacy);break}}}const x=JSON.parse(raw);if(x){const d=defaults();Object.keys(d).forEach(k=>x[k]??=d[k]);const gone=new Set(x.deletedSeeds||[]);SEED.events.forEach(e=>{if(gone.has(e.id)||gone.has(e.sourceKey))return;if(!x.events.some(y=>y.sourceKey===e.sourceKey||(y.name===e.name&&y.startDate===e.startDate)))x.events.push({...e})});SEED.products.forEach(p=>{if(gone.has(p.id))return;if(!x.products.some(y=>y.id===p.id))x.products.push({...p})});return x}}catch(e){}return defaults()}
function showToastRaw(msg,duration=2200){const el=document.getElementById('toast'),persistent=duration>=6000;el.textContent=msg;el.classList.add('show');el.classList.toggle('persist',persistent);clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show','persist'),duration)}
function save(action='更新資料'){try{if(window.v6BeforeSave)window.v6BeforeSave(db,action);db.updatedAt=new Date().toISOString();db.activity.unshift({id:id('log'),at:new Date().toISOString(),action,updatedAt:new Date().toISOString()});db.activity=db.activity.slice(0,300);localStorage.setItem(KEY,JSON.stringify(db));lastSaveError='';lastSaveFailureAt=0;render();if(window.v6Cloud)window.v6Cloud.scheduleSync(action);return true}catch(e){db=load();lastSaveError='資料未儲存：瀏覽器空間不足或無法寫入。請先匯出 JSON 備份並清理舊快照，再重試。';lastSaveFailureAt=Date.now();render();showToastRaw(lastSaveError,9000);return false}}
function toast(msg,duration=2200){if(lastSaveError&&Date.now()-lastSaveFailureAt<2500&&msg!==lastSaveError){msg=lastSaveError;duration=9000}showToastRaw(msg,duration)}
function project(pid){return db.projects.find(x=>x.id===pid)}function vendor(vid){return db.vendors.find(x=>x.id===vid)}function site(sid){return db.websites.find(x=>x.id===sid)}function sop(sid){return db.sops.find(x=>x.id===sid)}
function tag(text,kind='gray'){return `<span class="tag ${kind}">${esc(text)}</span>`}function statusTag(s){const map={intake:['收件匣','gray'],planning:['初步企劃','brand'],detail:['細化中','amber'],active:['執行中','teal'],waiting:['等待中','amber'],closed:['已結案','gray'],pending:['待確認','amber'],asked:['等回覆','rose'],confirmed:['已確認','teal'],changed:['有變更','brand'],inbox:['待整理','amber'],sorted:['已整理','teal'],draft:['草稿','gray'],standard:['正式 SOP','teal'],verified:['已驗證','blue'],published:['已發布','teal'],review:['待預覽','amber'],blocked:['卡住','rose']};const m=map[s]||[s,'gray'];return tag(m[0],m[1])}
function stageOrder(x){return ['intake','planning','detail','active','waiting','closed'].indexOf(x)}
let modalInitialState=null,modalViewId=0,modalTransitionActive=false,modalCallbackTimers=new Set();
function modalFormState(){const box=document.getElementById('modal');if(!box)return'';return JSON.stringify([...box.querySelectorAll('input,textarea,select')].filter(el=>!el.hasAttribute('data-modal-ephemeral')).map((el,index)=>({key:el.id||el.name||index,type:el.type||el.tagName,value:el.type==='file'?[...el.files].map(f=>`${f.name}:${f.size}:${f.lastModified}`).join('|'):el.value,checked:'checked'in el?el.checked:null})))}
function modalHasUnsavedChanges(){return document.getElementById('modalBackdrop').classList.contains('open')&&modalInitialState!==null&&modalFormState()!==modalInitialState}
function setModalBusy(reason=''){const box=document.getElementById('modal'),busy=Boolean(reason);modalBusyReason=busy?String(reason):'';if(busy)modalOperationId++;if(box){box.setAttribute('aria-busy',String(busy));box.querySelectorAll('button,input,textarea,select').forEach(el=>{if(busy){if(!el.hasAttribute('data-modal-was-disabled'))el.setAttribute('data-modal-was-disabled',el.disabled?'1':'0');el.disabled=true}else if(el.hasAttribute('data-modal-was-disabled')){el.disabled=el.getAttribute('data-modal-was-disabled')==='1';el.removeAttribute('data-modal-was-disabled')}})}return modalOperationId}
function clearModalCallbacks(){modalCallbackTimers.forEach(timer=>clearTimeout(timer));modalCallbackTimers.clear()}
function scheduleModalCallback(callback,delay=0){const viewId=modalViewId,timer=setTimeout(()=>{modalCallbackTimers.delete(timer);if(viewId!==modalViewId||!document.getElementById('modalBackdrop').classList.contains('open'))return;callback()},delay);modalCallbackTimers.add(timer);return timer}
function mountModal(title,sub,body,wide=false){if(modalBusyReason){toast(modalBusyReason,6500);return false}clearModalCallbacks();modalViewId++;modalInitialState=null;document.getElementById('modal').className=`modal${wide?' wide':''}`;document.getElementById('modal').innerHTML=`<div class="modal-head"><div><h2>${title}</h2><p>${sub||''}</p></div><button class="btn icon" onclick="app.requestCloseModal()">✕</button></div>${body}`;document.getElementById('modalBackdrop').classList.add('open');scheduleModalCallback(()=>{modalInitialState=modalFormState()},0);return true}
function modal(title,sub,body,wide=false){const open=document.getElementById('modalBackdrop').classList.contains('open');if(open&&!modalTransitionActive)return requestModalTransition(()=>mountModal(title,sub,body,wide));return mountModal(title,sub,body,wide)}
function closeModal(force=false){if(modalBusyReason&&!force){toast(modalBusyReason,6500);return false}if(lastSaveError&&Date.now()-lastSaveFailureAt<2500){showToastRaw(lastSaveError,9000);return false}clearModalCallbacks();modalViewId++;document.getElementById('modalBackdrop').classList.remove('open');modalInitialState=null;return true}
function requestModalTransition(nextAction=null,options={}){if(modalBusyReason){toast(modalBusyReason,6500);return false}const message=options.message||'這張表單有尚未儲存的內容。\n按「確定」放棄變更；按「取消」繼續編輯。';if(modalHasUnsavedChanges()&&!confirm(message))return false;if(typeof nextAction!=='function')return closeModal();clearModalCallbacks();modalTransitionActive=true;try{return nextAction()!==false}finally{modalTransitionActive=false}}
function requestCloseModal(){return requestModalTransition()}
function lastSaveFailed(){if(!lastSaveError)return false;if(Date.now()-lastSaveFailureAt<2500)return true;try{const raw=localStorage.getItem(KEY);localStorage.setItem(KEY,raw||JSON.stringify(db));lastSaveError='';lastSaveFailureAt=0;return false}catch(e){return true}}
function isModalBusy(){return Boolean(modalBusyReason)}
function isModalInstance(operationId){return Boolean(modalBusyReason)&&Number(operationId)===modalOperationId&&document.getElementById('modalBackdrop').classList.contains('open')}
function toggleMobileNav(force){const aside=document.getElementById('mainNav'),button=document.getElementById('mobileNavToggle');if(!aside||!button)return;const open=typeof force==='boolean'?force:!aside.classList.contains('mobile-nav-open');aside.classList.toggle('mobile-nav-open',open);button.setAttribute('aria-expanded',String(open));button.textContent=open?'✕ 收起選單':'☰ 功能選單'}
function goHome(){const home=document.querySelector('.nav[data-view="dashboard"]');if(home)home.click()}
const backdropEl=document.getElementById('modalBackdrop');let backdropDown=false;backdropEl.addEventListener('mousedown',e=>{backdropDown=(e.target===backdropEl)});backdropEl.addEventListener('mouseup',e=>{if(backdropDown&&e.target===backdropEl)requestModalTransition();backdropDown=false});document.addEventListener('click',e=>{const button=e.target.closest('#modal [onclick="app.closeModal()"]');if(!button)return;e.preventDefault();e.stopImmediatePropagation();requestModalTransition()},true);document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const lightbox=document.getElementById('v6Lightbox');if(lightbox&&lightbox.classList.contains('open')){e.preventDefault();e.stopImmediatePropagation();if(window.v6App&&v6App.closeLightbox)v6App.closeLightbox();return}if(backdropEl.classList.contains('open')){e.preventDefault();requestModalTransition()}});window.addEventListener('beforeunload',e=>{if(!modalHasUnsavedChanges())return;e.preventDefault();e.returnValue=''})
function openView(next){view=next;render();toggleMobileNav(false)}
document.querySelectorAll('.nav[data-view]').forEach(b=>b.onclick=()=>openView(b.dataset.view));document.getElementById('mainNav').addEventListener('click',e=>{if(window.innerWidth<=1000&&e.target.closest('.nav')&&!e.target.closest('.nav[data-view]'))setTimeout(()=>toggleMobileNav(false),0)});
function nav(){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===view));const meta={dashboard:['首頁控制台','今天先掌握需要推進、確認與收尾的事情。'],tasks:['我的工作','今天、本週、未排期與等待中的工作都集中在這裡。'],work:['專案','新任務先分級，再逐步形成可執行的專案。'],confirmations:['確認中心','所有等待回覆與需要追問的事項集中管理。'],events:['擺攤／節慶／年度','活動資訊、素材規格與倒數任務都由資料管理。'],websites:['官網營運中心','網站是持續營運主線；每次改版則是可追蹤的變更專案。'],files:['檔案收集箱','先收好、再分類，留住原檔、輸出檔與最終版本。'],sops:['SOP 流程庫','只收納可重複使用的正式流程，原始經驗保留來源。'],knowledge:['經驗收集與整理','把踩雷、注意事項、決策與發現整理成可連結的知識。'],vendors:['廠商知識庫','找得到誰能做、多久能做、急件找誰與曾經踩過的坑。']};document.getElementById('pageTitle').textContent=meta[view][0];document.getElementById('pageSub').textContent=meta[view][1]}
function relatedKnowledge({projectId='',vendorIds=[],sopId=''}){const ids=new Set(vendorIds);return db.knowledge.filter(k=>k.status!=='archived'&&((projectId&&k.links?.projectIds?.includes(projectId))||(sopId&&k.links?.sopIds?.includes(sopId))||(k.links?.vendorIds||[]).some(x=>ids.has(x)))).sort((a,b)=>(b.priority||0)-(a.priority||0))}
function projectTasks(pid){return db.tasks.filter(t=>t.projectId===pid)}function openTasks(){return db.tasks.filter(t=>t.status!=='done')}
function moreRow(count,action){return count>0?`<div class="list-more">另有 ${count} 件 <button class="btn small" onclick="${action}">查看全部</button></div>`:''}
function dashboard(){const taskDue=openTasks().filter(t=>t.dueDate&&days(t.dueDate)<=0);const conf=db.confirmations.filter(c=>!['confirmed','cancelled'].includes(c.status));const follow=conf.filter(c=>c.nextFollowup&&days(c.nextFollowup)<=0);const routines=db.routines.filter(r=>r.active&&r.nextDate&&days(r.nextDate)<=0);const printActive=(db.printWorkOrders||[]).filter(w=>w.status!=='closed');const printFocus=printActive.sort((a,b)=>(a.kind==='urgent'?-1:1)-(b.kind==='urgent'?-1:1)||String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999'))).slice(0,6);const allItems=[...taskDue.map(x=>({type:'task',x,score:x.dueDate?days(x.dueDate):9})),...follow.map(x=>({type:'confirmation',x,score:days(x.nextFollowup)})),...routines.map(x=>({type:'routine',x,score:days(x.nextDate)}))].sort((a,b)=>a.score-b.score);const items=allItems.slice(0,9);const allProjects=db.projects.filter(p=>p.stage!=='closed').sort((a,b)=>stageOrder(a.stage)-stageOrder(b.stage));const shownProjects=allProjects.slice(0,6);const allEvents=db.events.filter(e=>(e.endDate||e.startDate)>=today()).sort((a,b)=>a.startDate.localeCompare(b.startDate));const shownEvents=allEvents.slice(0,5);const allKnowledge=db.knowledge.filter(k=>k.status==='inbox');const shownKnowledge=allKnowledge.slice(0,5);
return `<section id="dashboardTodayTasks"><div class="section-head"><div><h2>今天要處理</h2><small>依到期、追問與例行工作排序</small></div><button class="btn small" onclick="app.openTask()">＋ 工作</button></div><div class="list">${items.length?items.map(i=>attentionRow(i)).join(''):'<div class="empty">今天沒有逾期或待追問項目。</div>'}${moreRow(allItems.length-items.length,"app.openView('tasks')")}</div></section>
<div class="section-head"><div><h2>印製工單追蹤</h2><small>急件優先，其次依交期排列；驗收完成後才能結案</small></div><button class="btn small" onclick="printApp.openOrder()">＋ 印製工單</button></div><div class="list" style="margin-bottom:18px">${printFocus.length?printFocus.map(w=>`<div class="item clickable ${w.kind==='urgent'?'attention critical':''}" onclick="printApp.openOrder('${w.id}')"><div class="title-line"><div><strong>${esc(w.title||'未命名工單')}</strong><div class="tags">${tag(w.kind==='urgent'?'急件':'日常',w.kind==='urgent'?'rose':'teal')}${tag({intake:'需求待整理',spec:'規格確認',quote:'詢價／發包',proof:'校稿確認',ordered:'已送印',printing:'印製中',inspection:'等待驗收',blocked:'卡住'}[w.status]||w.status||'需求待整理','gray')}</div><div class="meta">${esc([w.vendor,w.dueDate?'交期 '+w.dueDate:''].filter(Boolean).join(' · '))}</div></div><span>›</span></div></div>`).join(''):'<div class="empty">尚無進行中的印製工單。</div>'}</div>
<div class="grid two"><div><div class="section-head"><div><h2>專案狀況</h2><small>每個進行中專案都應有下一步</small></div><button class="btn small" onclick="app.openProject()">＋ 專案</button></div><div class="list">${shownProjects.map(projectRow).join('')||'<div class="empty">建立新專案後，這裡會顯示目前狀況。</div>'}${moreRow(allProjects.length-shownProjects.length,"app.openView('work')")}</div></div><div><div class="section-head"><div><h2>近期擺攤／節慶</h2><small>資訊未齊與素材任務會顯示在這裡</small></div><button class="btn small" onclick="app.openEvent()">＋ 活動</button></div><div class="list">${shownEvents.map(eventRow).join('')||'<div class="empty">尚無近期活動。</div>'}${moreRow(allEvents.length-shownEvents.length,"app.openView('events')")}</div></div></div>
<div class="section-head"><div><h2>待整理工作經驗</h2><small>可連到 SOP、廠商與專案</small></div><button class="btn small" onclick="app.openKnowledge()">＋ 記錄</button></div><div class="list">${shownKnowledge.map(knowledgeRow).join('')||'<div class="empty">收集到的新經驗會先放在這裡。</div>'}${moreRow(allKnowledge.length-shownKnowledge.length,"app.openView('knowledge')")}</div>`}
function attentionRow(i){let name='',sub='',action='';if(i.type==='task'){name=i.x.name;sub=`${project(i.x.projectId)?.name||'未連結專案'} · ${i.x.dueDate?fmt(i.x.dueDate):'未設定日期'}`;action=`<button class="btn small" onclick="app.toggleTask('${i.x.id}')">完成</button>`}if(i.type==='confirmation'){name=`確認：${i.x.question}`;sub=`等 ${i.x.person||'未指定'} · ${project(i.x.projectId)?.name||'未連結專案'}`;action=`<button class="btn small" onclick="app.openConfirmation('${i.x.id}')">處理</button>`}if(i.type==='routine'){name=`例行：${i.x.name}`;sub=`本次應於 ${fmt(i.x.nextDate)} 執行`;action=`<button class="btn small" onclick="app.completeRoutine('${i.x.id}')">完成</button>`}const critical=i.score<0?'critical':i.score===0?'attention':'';return `<div class="item attention ${critical}"><div class="title-line"><div><strong>${esc(name)}</strong><div class="meta">${esc(sub)}</div></div>${action}</div></div>`}
function projectRow(p){const tasks=projectTasks(p.id),done=tasks.filter(t=>t.status==='done').length,next=tasks.find(t=>t.status!=='done')?.name||'尚未設定下一步';return `<div class="item clickable" onclick="app.openProject('${p.id}')"><div class="title-line"><div><strong>${esc(p.name)}</strong><div class="tags">${statusTag(p.stage)}${p.dueDate?tag(`截止 ${fmt(p.dueDate)}`,days(p.dueDate)<=3?'rose':'gray'):''}</div><div class="meta">下一步：${esc(next)}</div></div><span>›</span></div>${tasks.length?`<div class="progress"><i style="width:${Math.round(done/tasks.length*100)}%"></i></div>`:''}</div>`}
function eventRow(e){const missing=[];if(!e.place)missing.push('地點');if(!e.startDate)missing.push('日期');const tasks=db.tasks.filter(t=>t.eventId===e.id&&t.status!=='done');return `<div class="item clickable" onclick="app.openEvent('${e.id}')"><div class="title-line"><div><strong>${esc(e.name)}</strong><div class="tags">${tag(e.type==='booth'?'擺攤':e.type==='festival'?'節慶':'年度計畫','brand')}${missing.length?tag(`缺 ${missing.join('、')}`,'rose'):tag(`${tasks.length} 項未完成`,'teal')}</div><div class="meta">${fmt(e.startDate)}${e.endDate&&e.endDate!==e.startDate?' – '+fmt(e.endDate):''}${e.place?' · '+esc(e.place):''}</div></div><span>›</span></div></div>`}
function knowledgeRow(k){return `<div class="item clickable" onclick="app.openKnowledge('${k.id}')"><strong>${esc(k.title||k.text.slice(0,32))}</strong><div class="meta">${esc(k.text.slice(0,70))}</div><div class="tags">${statusTag(k.status)}${(k.tags||[]).slice(0,3).map(x=>tag('#'+x,'brand')).join('')}</div></div>`}
const taskViewState={filter:'today',query:''};
function taskIsWaiting(t){return t.status!=='done'&&(t.phase==='review'||Boolean(t.projectId&&db.confirmations.some(c=>c.projectId===t.projectId&&!['confirmed','cancelled'].includes(c.status))))}
function taskInView(t,filter){if(filter==='done')return t.status==='done';if(t.status==='done')return false;if(filter==='today')return Boolean(t.dueDate&&days(t.dueDate)<=0);if(filter==='week')return Boolean(t.dueDate&&days(t.dueDate)>0&&days(t.dueDate)<=7);if(filter==='unscheduled')return !t.dueDate;if(filter==='waiting')return taskIsWaiting(t);return true}
function taskDueLabel(t){if(t.status==='done')return t.completedAt?`完成於 ${fmt(t.completedAt.slice(0,10))}`:'已完成';if(!t.dueDate)return'未排期';const diff=days(t.dueDate);if(diff<0)return`⚠ 已逾期 ${Math.abs(diff)} 天`;if(diff===0)return'今天到期';return`${fmt(t.dueDate)} 到期`}
function taskListRow(t){const p=project(t.projectId),waiting=taskIsWaiting(t),overdue=t.status!=='done'&&t.dueDate&&days(t.dueDate)<0;return `<div class="item clickable ${overdue?'attention critical':''}" onclick="app.openTask('','${t.id}')"><div class="title-line"><div><strong>${esc(t.name)}</strong><div class="meta">${esc(p?.name||'未連結專案')} · ${esc(taskDueLabel(t))}</div><div class="tags">${tag(t.status==='done'?'已完成':waiting?'等別人':'未完成',t.status==='done'?'teal':waiting?'amber':'blue')}${tag({make:'製作',review:'確認',publish:'發布／交付',closeout:'收尾／留存'}[t.phase]||t.phase||'製作','gray')}</div></div><span>›</span></div></div>`}
function tasksView(){const filters=[['today','今天'],['week','本週'],['unscheduled','未排期'],['waiting','等別人'],['done','已完成']],q=taskViewState.query.toLowerCase();let rows=db.tasks.filter(t=>taskInView(t,taskViewState.filter));if(q)rows=rows.filter(t=>(t.name+' '+(project(t.projectId)?.name||'')).toLowerCase().includes(q));rows.sort((a,b)=>taskViewState.filter==='done'?String(b.completedAt||b.updatedAt||b.createdAt||'').localeCompare(String(a.completedAt||a.updatedAt||a.createdAt||'')):String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999')));return `<div class="section-head"><div><h2>我的工作</h2><small>不用先記得屬於哪個專案，也能直接找到下一件事。</small></div><button class="btn primary" onclick="app.openTask()">＋ 新增工作</button></div><div class="task-list-toolbar"><div class="view-tabs">${filters.map(([key,label])=>`<button class="view-tab ${taskViewState.filter===key?'active':''}" onclick="app.setTaskFilter('${key}')">${label} ${db.tasks.filter(t=>taskInView(t,key)).length}</button>`).join('')}</div><input class="v6-search" id="taskSearch" value="${esc(taskViewState.query)}" placeholder="搜尋工作或專案名稱" oninput="app.setTaskSearch(this.value)"></div><div class="list">${rows.map(taskListRow).join('')||`<div class="empty">這個分類目前沒有工作。<div style="margin-top:10px"><button class="btn primary" onclick="app.openTask()">＋ 新增工作</button></div></div>`}</div>`}
function setTaskFilter(filter){taskViewState.filter=filter;render()}
function setTaskSearch(query){taskViewState.query=query;render();requestAnimationFrame(()=>{const input=document.getElementById('taskSearch');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}})}
function work(){const stages=['intake','planning','detail','active','waiting','closed'];return `<div class="section-head"><div><h2>從收件到收尾的工作流程</h2><small>構想可以先留在收件匣；確認方向後再進入細化。</small></div><div class="row"><button class="btn" onclick="app.openCapture()">＋ 收件</button><button class="btn primary" onclick="app.openProject()">＋ 專案</button></div></div><div class="view-tabs">${stages.map(s=>`<button class="view-tab ${work.filter===s?'active':''}" onclick="app.setWorkFilter('${s}')">${statusTag(s)} ${db.projects.filter(p=>p.stage===s).length}</button>`).join('')}<button class="view-tab ${work.filter==='all'?'active':''}" onclick="app.setWorkFilter('all')">全部</button></div><div class="list">${db.projects.filter(p=>work.filter==='all'||p.stage===work.filter).sort((a,b)=>a.dueDate?.localeCompare(b.dueDate||'9999')||0).map(projectRow).join('')||'<div class="empty">這個階段尚無專案。</div>'}</div>`}work.filter='all';
function confirmations(){const list=[...db.confirmations].sort((a,b)=>({asked:0,pending:1,changed:2,confirmed:3}[a.status]??9)-({asked:0,pending:1,changed:2,confirmed:3}[b.status]??9));return `<div class="section-head"><div><h2>確認中心</h2><small>每件確認都知道：問什麼、問誰、卡住什麼、何時要追問。</small></div><button class="btn primary" onclick="app.openConfirmation()">＋ 新確認</button></div><div class="table-wrap"><table class="table"><thead><tr><th>確認事項</th><th>對象／專案</th><th>狀態與追問</th><th>操作</th></tr></thead><tbody>${list.map(c=>`<tr><td><strong>${esc(c.question)}</strong><div class="meta">${esc(c.result||'尚未記錄結果')}</div></td><td>${esc(c.person||'未指定')}<div class="meta">${esc(project(c.projectId)?.name||'未連結專案')}</div></td><td>${statusTag(c.status)}<div class="meta">${c.nextFollowup?'下次追問 '+fmt(c.nextFollowup):'未設追問日'}</div></td><td><button class="btn small" onclick="app.openConfirmation('${c.id}')">處理</button></td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">暫無確認事項。</div></td></tr>'}</tbody></table></div>`}
function events(){return `<div class="section-head"><div><h2>擺攤、節慶與年度計畫</h2><small>活動資料改一次，對應素材與倒數工作會一起追蹤。</small></div><button class="btn primary" onclick="app.openEvent()">＋ 新活動</button></div><div class="grid three">${db.events.sort((a,b)=>a.startDate.localeCompare(b.startDate)).map(e=>`<div class="card clickable" onclick="app.openEvent('${e.id}')"><div class="title-line"><h3>${esc(e.name)}</h3>${tag(e.type==='booth'?'擺攤':e.type==='festival'?'節慶':'計畫','brand')}</div><div class="meta">${fmt(e.startDate)}${e.endDate?' – '+fmt(e.endDate):''}</div><div class="meta">${e.place?'📍 '+esc(e.place):'⚠ 尚未填地點'}</div><div class="tags">${db.tasks.filter(t=>t.eventId===e.id&&t.status!=='done').length?tag(`${db.tasks.filter(t=>t.eventId===e.id&&t.status!=='done').length} 項素材／任務`,'amber'):tag('任務已完成','teal')}</div></div>`).join('')||'<div class="empty">先建立擺攤、節慶或年度活動，並設定素材倒數工作。</div>'}</div>`}
function websites(){return `<div class="section-head"><div><h2>兩站長期營運＋每次改版追蹤</h2><small>網站本身是持續專案；每次內容更新、Banner、修正則各自記錄版本。</small></div><div class="row"><button class="btn" onclick="app.openWebsite()">設定網站</button><button class="btn primary" onclick="app.openWebChange()">＋ 網站改版</button></div></div><div class="grid two">${db.websites.map(s=>websiteCard(s)).join('')}</div><div class="section-head"><div><h2>最近網站改版</h2><small>同一改版可分別追蹤官網 A、官網 B 的不同進度。</small></div></div><div class="list">${db.websiteChanges.sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).map(changeRow).join('')||'<div class="empty">建立第一筆網站改版後，HTML 草稿、預覽與版本都會留在這裡。</div>'}</div>`}
function websiteCard(s){const changes=db.websiteChanges.filter(c=>c.targets.some(t=>t.websiteId===s.id)&&!c.targets.every(t=>t.status==='published'));return `<div class="card clickable" onclick="app.openWebsite('${s.id}')"><div class="title-line"><div><h2>${esc(s.name)}</h2><div class="meta">${esc(s.platform||'未設定平台')}</div></div><span class="dot ${s.status==='active'?'good':'warn'}"></span></div><div class="meta">${s.url?esc(s.url):'尚未設定正式網址'}</div><div class="tags">${tag(`${changes.length} 筆進行中改版`,changes.length?'amber':'teal')}${s.note?tag('有營運備註','gray'):''}</div></div>`}
function changeRow(c){const states=c.targets.map(t=>`${site(t.websiteId)?.name||'網站'}：${{draft:'草稿',review:'待預覽',published:'已發布',blocked:'卡住'}[t.status]||t.status}`).join(' · ');return `<div class="item clickable" onclick="app.openWebChange('${c.id}')"><div class="title-line"><div><strong>${esc(c.title)} <span class="meta">v${c.version||1}</span></strong><div class="meta">${esc(states)}</div><div class="tags">${tag(c.type,'blue')}${c.projectId?tag(project(c.projectId)?.name||'關聯專案','brand'):''}</div></div><span>›</span></div></div>`}
function files(){return `<div class="section-head"><div><h2>檔案收集箱</h2><small>找不到歸屬時先收進來；最終檔、版本與位置不能靠記憶。</small></div><button class="btn primary" onclick="app.openFile()">＋ 記錄檔案</button></div><div class="table-wrap"><table class="table"><thead><tr><th>檔案／版本</th><th>位置／關聯</th><th>狀態</th><th></th></tr></thead><tbody>${db.files.map(f=>`<tr><td><strong>${esc(f.name)}</strong><div class="meta">${esc(f.kind||'未分類')} ${f.version?'· '+esc(f.version):''}</div></td><td>${esc(f.path||'尚未填位置')}<div class="meta">${esc(project(f.projectId)?.name||'未連結專案')}</div></td><td>${statusTag(f.status||'inbox')}</td><td><button class="btn small" onclick="app.openFile('${f.id}')">編輯</button></td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">尚無檔案紀錄。</div></td></tr>'}</tbody></table></div>`}
function sops(){return `<div class="section-head"><div><h2>正式 SOP 流程庫</h2><small>收集箱的原始經驗整理後才進入這裡；每份 SOP 可保留版本與來源。</small></div><button class="btn primary" onclick="app.openSop()">＋ 新 SOP</button></div><div class="grid three">${db.sops.map(s=>`<div class="card clickable" onclick="app.openSop('${s.id}')"><div class="title-line"><h3>${esc(s.title)}</h3>${statusTag(s.status||'draft')}</div><div class="meta">v${s.version||1} · ${esc(s.when||'未填使用情境')}</div><div class="tags">${(s.tags||[]).map(x=>tag('#'+x,'brand')).join('')}${tag(`${(s.steps||[]).length} 個步驟`,'gray')}</div></div>`).join('')||'<div class="empty">尚無正式 SOP；先從經驗收集箱整理出第一份。</div>'}</div>`}
function knowledge(){return `<div class="section-head"><div><h2>經驗收集箱與雙向整理</h2><small>一筆經驗可同時連到廠商、SOP 與專案，不複製成三份。</small></div><button class="btn primary" onclick="app.openKnowledge()">＋ 隨手記錄</button></div><div class="view-tabs"><button class="view-tab ${knowledge.filter==='inbox'?'active':''}" onclick="app.setKnowledgeFilter('inbox')">待整理 ${db.knowledge.filter(k=>k.status==='inbox').length}</button><button class="view-tab ${knowledge.filter==='all'?'active':''}" onclick="app.setKnowledgeFilter('all')">全部</button></div><div class="grid two">${db.knowledge.filter(k=>knowledge.filter==='all'||k.status==='inbox').map(knowledgeCard).join('')||'<div class="empty">目前沒有待整理經驗。</div>'}</div>`}knowledge.filter='inbox';
function knowledgeCard(k){const v=(k.links?.vendorIds||[]).map(x=>vendor(x)?.name).filter(Boolean),p=(k.links?.projectIds||[]).map(x=>project(x)?.name).filter(Boolean),s=(k.links?.sopIds||[]).map(x=>sop(x)?.title).filter(Boolean);return `<div class="card clickable" onclick="app.openKnowledge('${k.id}')"><div class="title-line"><h3>${esc(k.title||k.text.slice(0,38))}</h3>${statusTag(k.status)}</div><p class="meta" style="font-size:13px;color:var(--ink)">${esc(k.text)}</p><div class="tags">${(k.tags||[]).map(x=>tag('#'+x,'brand')).join('')}${v.map(x=>tag('廠商：'+x,'blue')).join('')}${p.map(x=>tag('專案：'+x,'teal')).join('')}${s.map(x=>tag('SOP：'+x,'amber')).join('')}</div></div>`}
function vendors(){return `<div class="section-head"><div><h2>廠商能力與實務經驗</h2><small>記錄可接項目、一般／急件工作天與團隊踩過的坑。</small></div><button class="btn primary" onclick="app.openVendor()">＋ 新廠商</button></div><div class="grid three">${db.vendors.map(v=>`<div class="card clickable" onclick="app.openVendor('${v.id}')"><div class="title-line"><h3>${esc(v.name)}</h3>${v.urgentDays?tag(`急件 ${v.urgentDays} 天`,'rose'):''}</div><div class="meta">一般 ${v.normalDays||'?'} 工作天 · ${esc(v.contact||'未填聯絡人')}</div><div class="tags">${(v.capabilities||[]).map(x=>tag(x,'blue')).join('')}${relatedKnowledge({vendorIds:[v.id]}).length?tag(`${relatedKnowledge({vendorIds:[v.id]}).length} 筆相關經驗`,'amber'):''}</div></div>`).join('')||'<div class="empty">先建立常用廠商，之後選廠商時就會自動帶出注意事項。</div>'}</div>`}
function render(){nav();const views={dashboard,tasks:tasksView,work,confirmations,events,websites,files,sops,knowledge,vendors};document.getElementById('content').innerHTML=views[view]()}
function options(arr,current=''){return arr.map(x=>`<option value="${x.id}" ${x.id===current?'selected':''}>${esc(x.name||x.title)}</option>`).join('')}
function checks(name,arr,selected=[]){return `<div class="checks">${arr.map(x=>`<label class="check"><input type="checkbox" name="${name}" value="${x.id}" ${selected.includes(x.id)?'checked':''}>${esc(x.name||x.title)}</label>`).join('')||'<span class="meta">尚無可選資料</span>'}</div>`}
function values(name){return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value)}
function openCapture(){modal('隨手記錄','先記下來，之後再決定它屬於哪個專案。',`<div class="field"><label>記錄內容 *</label><textarea id="capText" placeholder="例如：明天確認中秋 Banner 文案，或記下某印刷廠紅色容易偏暗"></textarea></div><div class="form-grid"><div class="field"><label>這是什麼</label><select id="capType"><option value="task">要做的事（會進待辦並提醒）</option><option value="knowledge">想記下來的經驗（稍後整理）</option></select></div><div class="field"><label>日期（選填）</label><input id="capDate" type="date"><div class="row capture-date-shortcuts"><button class="btn small" type="button" onclick="app.setCaptureDate('today')">今天</button><button class="btn small" type="button" onclick="app.setCaptureDate('tomorrow')">明天</button><button class="btn small" type="button" onclick="app.setCaptureDate('week')">本週</button></div></div><div class="field full"><label>Tag（逗號分隔；經驗使用）</label><input id="capTags" placeholder="印刷, DM, 色彩"></div></div><div class="modal-foot"><button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" onclick="app.saveCapture()">儲存</button></div>`)}
function setCaptureDate(mode){let date=today();if(mode==='tomorrow')date=dateAdd(date,1);if(mode==='week'){const weekday=new Date(`${date}T12:00:00`).getDay();date=dateAdd(date,(7-weekday)%7)}document.getElementById('capDate').value=date}
function captureDueText(date){if(!date)return'未排日期';const diff=days(date);return diff===0?'今天到期':diff===1?'明天到期':`${fmt(date)} 到期`}
function saveCapture(){const text=document.getElementById('capText').value.trim();if(!text)return toast('請先輸入內容');const tags=document.getElementById('capTags').value.split(',').map(x=>x.trim()).filter(Boolean),type=document.getElementById('capType').value,dueDate=document.getElementById('capDate').value,stamp=new Date().toISOString();if(type==='knowledge'){db.knowledge.unshift({id:id('know'),title:text.slice(0,36),text,tags,status:'inbox',priority:1,reliability:'single',links:{vendorIds:[],projectIds:[],sopIds:[]},createdAt:stamp,updatedAt:stamp});save('新增工作經驗');closeModal();toast('已收進經驗收集箱。')}else{db.tasks.unshift({id:id('task'),name:text.slice(0,80),dueDate,status:'open',phase:'make',projectId:'',eventId:'',createdAt:stamp,updatedAt:stamp});save('從隨手記錄新增待辦');closeModal();toast(`已加入待辦，${captureDueText(dueDate)}。`)}}
function openProject(pid=''){const p=pid?project(pid):null;const tasks=p?projectTasks(p.id):[],kn=p?relatedKnowledge({projectId:p.id,vendorIds:p.vendorIds||[]}):[];modal(p?'專案工作頁':'新增專案',p?'專案摘要、下一步、確認與知識會集中在這裡。':'新任務先分級，方向清楚後再細化。',`<input id="projectId" type="hidden" value="${p?.id||''}"><div class="form-grid"><div class="field"><label>專案名稱 *</label><input id="projectName" value="${esc(p?.name||'')}" placeholder="例：中秋節擺攤宣傳"></div><div class="field"><label>目前階段</label><select id="projectStage">${['intake','planning','detail','active','waiting','closed'].map(x=>`<option value="${x}" ${(p?.stage||'intake')===x?'selected':''}>${{intake:'收件匣',planning:'初步企劃',detail:'細化中',active:'執行中',waiting:'等待中',closed:'已結案'}[x]}</option>`).join('')}</select></div><div class="field"><label>截止日</label><input id="projectDue" type="date" value="${p?.dueDate||''}"></div><div class="field"><label>重要度</label><select id="projectPriority"><option>normal</option><option ${p?.priority==='high'?'selected':''}>high</option><option ${p?.priority==='urgent'?'selected':''}>urgent</option></select></div><div class="field full"><label>初步企劃／背景</label><textarea id="projectBrief" placeholder="目標、粗略做法、目前卡住什麼…">${esc(p?.brief||'')}</textarea></div><div class="field full"><label>關聯廠商（選了之後會跳出相關經驗）</label>${checks('projectVendor',db.vendors,p?.vendorIds||[])}</div></div>${p?`<div class="grid two"><div class="card"><h3>任務與下一步</h3><div class="list" style="margin-top:8px">${tasks.map(t=>`<div class="item"><div class="row between"><span>${t.status==='done'?'✓':'○'} ${esc(t.name)}</span><div class="row"><button class="btn small" onclick="app.openTask('','${t.id}')">編輯</button><button class="btn small" onclick="app.toggleTask('${t.id}')">${t.status==='done'?'重開':'完成'}</button></div></div></div>`).join('')||'<div class="meta">尚未建立任務</div>'}</div><button class="btn small" style="margin-top:8px" onclick="app.openTask('${p.id}')">＋ 加任務</button></div><div class="card"><h3>自動帶出的相關知識</h3><div class="list" style="margin-top:8px">${kn.map(k=>`<div class="item clickable" onclick="app.openKnowledge('${k.id}')"><strong>${esc(k.title)}</strong><div class="meta">${esc(k.text.slice(0,70))}</div></div>`).join('')||'<div class="meta">選擇廠商或連結經驗後，注意事項會顯示在這裡。</div>'}</div></div></div>`:''}<div class="modal-foot">${p?`<button class="btn danger" onclick="app.remove('projects','${p.id}')">刪除</button>`:''}<button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" onclick="app.saveProject()">儲存</button></div>`,true)}
function saveProject(){const name=document.getElementById('projectName').value.trim();if(!name)return toast('請輸入專案名稱');const pid=document.getElementById('projectId').value;const data={name,stage:document.getElementById('projectStage').value,dueDate:document.getElementById('projectDue').value,priority:document.getElementById('projectPriority').value,brief:document.getElementById('projectBrief').value.trim(),vendorIds:values('projectVendor'),updatedAt:new Date().toISOString()};if(pid)Object.assign(project(pid),data);else db.projects.unshift({id:id('proj'),...data,createdAt:new Date().toISOString()});save('儲存專案');closeModal();toast('專案已儲存')}
function openTask(pid='',tid=''){const t=tid?db.tasks.find(x=>x.id===tid):null;if(!modal(t?'編輯工作':'新增工作','工作可連到專案、活動或網站；既有工作可調整日期、階段與狀態。',`<input id="taskId" type="hidden" value="${t?.id||''}"><div class="form-grid"><div class="field full"><label>工作名稱 *</label><input id="taskName" value="${esc(t?.name||'')}" placeholder="例：確認桌機 Banner 1700×730"></div><div class="field"><label>關聯專案</label><select id="taskProject"><option value="">未連結</option>${options(db.projects,t?.projectId||pid)}</select></div><div class="field"><label>關聯活動</label><select id="taskEvent"><option value="">未連結</option>${options(db.events,t?.eventId)}</select></div><div class="field"><label>到期日</label><input id="taskDue" type="date" value="${t?.dueDate||''}"></div><div class="field"><label>階段</label><select id="taskPhase"><option value="make">製作</option><option value="review">確認</option><option value="publish">發布／交付</option><option value="closeout">收尾／留存</option></select></div><div class="field"><label>狀態</label><select id="taskStatus"><option value="open">未完成</option><option value="done">已完成</option></select></div></div><div class="modal-foot">${t?`<button class="btn danger" onclick="app.remove('tasks','${t.id}')">刪除</button>`:''}<button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" onclick="app.saveTask()">${t?'儲存工作':'新增工作'}</button></div>`))return false;document.getElementById('taskPhase').value=t?.phase||'make';document.getElementById('taskStatus').value=t?.status||'open';return true}
function saveTask(){const name=document.getElementById('taskName').value.trim();if(!name)return toast('請輸入工作名稱');const tid=document.getElementById('taskId').value,data={name,projectId:document.getElementById('taskProject').value,eventId:document.getElementById('taskEvent').value,dueDate:document.getElementById('taskDue').value,phase:document.getElementById('taskPhase').value,status:document.getElementById('taskStatus').value,updatedAt:new Date().toISOString()};if(tid){const old=db.tasks.find(x=>x.id===tid);if(old?.eventId&&old.dueDate!==data.dueDate)data.manualDueDate=true;Object.assign(old,data)}else db.tasks.unshift({id:id('task'),...data,createdAt:new Date().toISOString()});save(tid?'更新工作':'新增工作');closeModal();toast(tid?'工作已更新':'工作已新增')}
function toggleTask(tid){const t=db.tasks.find(x=>x.id===tid);t.status=t.status==='done'?'open':'done';t.completedAt=t.status==='done'?new Date().toISOString():'';save(t.status==='done'?'完成工作':'重開工作');toast(t.status==='done'?'已完成':'已重開')}
function openConfirmation(cid=''){const c=cid?db.confirmations.find(x=>x.id===cid):null;modal(c?'處理確認事項':'新增確認事項','確認必須知道問誰、問什麼，以及什麼時候要追問。',`<input type="hidden" id="confirmId" value="${c?.id||''}"><div class="form-grid"><div class="field full"><label>要確認什麼 *</label><input id="confirmQuestion" value="${esc(c?.question||'')}" placeholder="例：確認 DM 數量與交期"></div><div class="field"><label>找誰確認</label><input id="confirmPerson" value="${esc(c?.person||'')}" placeholder="例：王小姐／老闆"></div><div class="field"><label>關聯專案</label><select id="confirmProject"><option value="">未連結</option>${options(db.projects,c?.projectId)}</select></div><div class="field"><label>目前狀態</label><select id="confirmStatus">${['pending','asked','confirmed','changed','cancelled'].map(x=>`<option value="${x}" ${(c?.status||'pending')===x?'selected':''}>${{pending:'待提出',asked:'等回覆',confirmed:'已確認',changed:'有變更',cancelled:'不需要'}[x]}</option>`).join('')}</select></div><div class="field"><label>下次追問日</label><input id="confirmFollow" type="date" value="${c?.nextFollowup||''}"></div><div class="field full"><label>確認結果／證據</label><textarea id="confirmResult" placeholder="回覆內容、截圖位置、決定結果…">${esc(c?.result||'')}</textarea></div></div><div class="modal-foot">${c?`<button class="btn danger" onclick="app.remove('confirmations','${c.id}')">刪除</button>`:''}<button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" onclick="app.saveConfirmation()">儲存</button></div>`)}
function saveConfirmation(){const question=document.getElementById('confirmQuestion').value.trim();if(!question)return toast('請填寫確認事項');const cid=document.getElementById('confirmId').value;const data={question,person:document.getElementById('confirmPerson').value.trim(),projectId:document.getElementById('confirmProject').value,status:document.getElementById('confirmStatus').value,nextFollowup:document.getElementById('confirmFollow').value,result:document.getElementById('confirmResult').value.trim(),updatedAt:new Date().toISOString()};if(cid)Object.assign(db.confirmations.find(x=>x.id===cid),data);else db.confirmations.unshift({id:id('confirm'),...data,createdAt:new Date().toISOString()});save('儲存確認事項');closeModal();toast('確認事項已儲存')}
/* 未使用：V1 版本，正式版為 openEventV2／saveEventV2 */function openEventV1Unused(eid=''){const e=eid?db.events.find(x=>x.id===eid):null;modal(e?'編輯活動':'新增擺攤／節慶／年度活動','素材任務格式：名稱 | 活動前幾天 | 規格或備註。可自行新增、刪除或修改天數。',`<input type="hidden" id="eventId" value="${e?.id||''}"><div class="form-grid"><div class="field"><label>名稱 *</label><input id="eventName" value="${esc(e?.name||'')}" placeholder="例：中秋節擺攤"></div><div class="field"><label>類型</label><select id="eventType"><option value="booth" ${e?.type==='booth'?'selected':''}>擺攤／展售</option><option value="festival" ${e?.type==='festival'?'selected':''}>節慶 Banner</option><option value="annual" ${e?.type==='annual'?'selected':''}>年度計畫</option></select></div><div class="field"><label>開始日</label><input id="eventStart" type="date" value="${e?.startDate||''}"></div><div class="field"><label>結束日</label><input id="eventEnd" type="date" value="${e?.endDate||''}"></div><div class="field full"><label>地點／活動資訊</label><input id="eventPlace" value="${esc(e?.place||'')}" placeholder="例：南港展覽館／攤位 Q1429"></div><div class="field full"><label>素材與倒數任務（每行：名稱 | 天數 | 規格）</label><textarea id="eventItems" placeholder="桌機 Banner | 14 | 1700×730&#10;手機 Banner | 10 | 請填平台尺寸&#10;FB 圖文 | 7 | 確認文案與發布&#10;DM | 10 | 選填">${esc(e?.itemsText||'桌機 Banner | 14 | 1700×730\n手機 Banner | 10 | 請填平台尺寸\nFB 圖文 | 7 | 確認文案與發布')}</textarea></div><div class="field full"><label>備注</label><textarea id="eventNote">${esc(e?.note||'')}</textarea></div></div>${e?`<div class="notice">更新日期後，既有未完成任務不會自動覆蓋；可手動檢查並調整，避免錯改已執行的工作。</div>`:''}<div class="modal-foot">${e?`<button class="btn danger" onclick="app.remove('events','${e.id}')">刪除</button>`:''}<button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" onclick="app.saveEvent()">儲存${e?'資料':'並建立任務'}</button></div>`)}
function saveEventV1Unused(){const name=document.getElementById('eventName').value.trim(),startDate=document.getElementById('eventStart').value;if(!name||!startDate)return toast('請填寫名稱與開始日');const eid=document.getElementById('eventId').value,itemsText=document.getElementById('eventItems').value.trim();const data={name,type:document.getElementById('eventType').value,startDate,endDate:document.getElementById('eventEnd').value||startDate,place:document.getElementById('eventPlace').value.trim(),itemsText,note:document.getElementById('eventNote').value.trim(),updatedAt:new Date().toISOString()};let event;if(eid){event=db.events.find(x=>x.id===eid);Object.assign(event,data)}else{event={id:id('event'),...data,createdAt:new Date().toISOString()};db.events.push(event);itemsText.split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(x=>x[0]).forEach(parts=>{const offset=Number(parts[1]||0);db.tasks.push({id:id('task'),name:parts[0]+(parts[2]?`（${parts[2]}）`:''),eventId:event.id,projectId:'',dueDate:dateAdd(startDate,-offset),phase:parts[0].includes('FB')?'publish':'make',status:'open',createdAt:new Date().toISOString()})})}save('儲存活動資料');closeModal();toast(eid?'活動資料已更新':'活動與倒數任務已建立')}
function openWebsite(sid=''){const s=sid?site(sid):null;modal(s?'網站營運設定':'新增網站','網站是長期營運中心；每次改版請另外建立「網站改版」紀錄。',`<input type="hidden" id="siteId" value="${s?.id||''}"><div class="form-grid"><div class="field"><label>網站名稱 *</label><input id="siteName" value="${esc(s?.name||'')}" placeholder="例：官網 A"></div><div class="field"><label>平台／後台說明</label><input id="sitePlatform" value="${esc(s?.platform||'可編輯 HTML 區塊')}" placeholder="例：後台自訂 HTML 區塊"></div><div class="field full"><label>正式網址</label><input id="siteUrl" value="${esc(s?.url||'')}" placeholder="https://..."></div><div class="field full"><label>持續營運備註</label><textarea id="siteNote" placeholder="常更新的頁面、登入位置、預覽方式、注意事項…">${esc(s?.note||'')}</textarea></div></div><div class="modal-foot">${s?`<button class="btn danger" onclick="app.remove('websites','${s.id}')">刪除</button>`:''}<button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" onclick="app.saveWebsite()">儲存</button></div>`)}
function saveWebsite(){const name=document.getElementById('siteName').value.trim();if(!name)return toast('請填寫網站名稱');const sid=document.getElementById('siteId').value,data={name,platform:document.getElementById('sitePlatform').value.trim(),url:document.getElementById('siteUrl').value.trim(),note:document.getElementById('siteNote').value.trim(),status:'active'};if(sid)Object.assign(site(sid),data);else db.websites.push({id:id('site'),...data});save('儲存網站設定');closeModal();toast('網站設定已儲存')}
function openWebChange(cid=''){const c=cid?db.websiteChanges.find(x=>x.id===cid):null;modal(c?'網站改版紀錄':'新增網站改版','可同時勾選兩站；HTML 草稿會保留版本，預覽後再到各站後台發布。',`<input type="hidden" id="changeId" value="${c?.id||''}"><div class="form-grid"><div class="field full"><label>改版名稱 *</label><input id="changeTitle" value="${esc(c?.title||'')}" placeholder="例：中秋節首頁 Banner 改版"></div><div class="field"><label>類型</label><select id="changeType"><option value="content">內容更新</option><option value="visual">視覺／Banner</option><option value="fix">修正</option><option value="maintenance">例行維護</option></select></div><div class="field"><label>關聯專案</label><select id="changeProject"><option value="">未連結</option>${options(db.projects,c?.projectId)}</select></div><div class="field full"><label>要更新的網站</label>${checks('changeSite',db.websites,(c?.targets||[]).map(x=>x.websiteId))}</div><div class="field full"><label>HTML 草稿</label><textarea id="changeHtml" style="min-height:180px;font-family:ui-monospace,Consolas,monospace" placeholder="貼上要放進後台的 HTML 區塊…">${esc(c?.html||'')}</textarea></div><div class="field full"><label>修改說明／發布前確認</label><textarea id="changeNote" placeholder="要改哪個區塊、需確認桌機／手機版／連結…">${esc(c?.note||'')}</textarea></div></div>${c?`<div class="card"><h3>各站發布狀態</h3><div class="list" style="margin-top:8px">${c.targets.map(t=>`<div class="item"><strong>${esc(site(t.websiteId)?.name||'網站')}</strong><div class="row" style="margin-top:6px"><select id="targetStatus_${t.websiteId}" style="width:auto"><option value="draft" ${t.status==='draft'?'selected':''}>草稿</option><option value="review" ${t.status==='review'?'selected':''}>待預覽</option><option value="published" ${t.status==='published'?'selected':''}>已發布</option><option value="blocked" ${t.status==='blocked'?'selected':''}>卡住</option></select><input id="targetUrl_${t.websiteId}" value="${esc(t.previewUrl||'')}" placeholder="預覽或正式網址" style="flex:1"></div></div>`).join('')}</div></div>`:''}<div class="modal-foot">${c?`<button class="btn danger" onclick="app.remove('websiteChanges','${c.id}')">刪除</button>`:''}<button class="btn" onclick="app.closeModal()">取消</button><button class="btn" onclick="app.previewHtml()">預覽 HTML</button><button class="btn primary" onclick="app.saveWebChange()">儲存版本</button></div>`,true);if(c)document.getElementById('changeType').value=c.type||'content'}
function saveWebChange(){const title=document.getElementById('changeTitle').value.trim();if(!title)return toast('請填寫改版名稱');const cid=document.getElementById('changeId').value,siteIds=values('changeSite');if(!siteIds.length)return toast('至少選擇一個網站');let c=cid?db.websiteChanges.find(x=>x.id===cid):null;const targets=siteIds.map(sid=>{const old=c?.targets.find(x=>x.websiteId===sid);return {websiteId:sid,status:old?document.getElementById(`targetStatus_${sid}`).value:'draft',previewUrl:old?document.getElementById(`targetUrl_${sid}`).value:''}});const data={title,type:document.getElementById('changeType').value,projectId:document.getElementById('changeProject').value,html:document.getElementById('changeHtml').value,note:document.getElementById('changeNote').value.trim(),targets,updatedAt:new Date().toISOString()};if(c){Object.assign(c,data);c.version=(c.version||1)+1}else{db.websiteChanges.unshift({id:id('webchange'),...data,version:1,createdAt:new Date().toISOString()})}save('儲存網站改版版本');closeModal();toast('網站改版版本已儲存')}
function previewHtml(){const html=document.getElementById('changeHtml')?.value||'',foot=document.querySelector('#modal .modal-foot');let wrap=document.getElementById('inlineHtmlPreview');if(!wrap&&foot){foot.insertAdjacentHTML('beforebegin','<div id="inlineHtmlPreview" class="card"><div class="row between"><h3>HTML 草稿預覽</h3><span class="meta">正式平台樣式仍須到網站後台確認</span></div><iframe id="inlineHtmlFrame" class="html-preview" sandbox="allow-same-origin"></iframe></div>');wrap=document.getElementById('inlineHtmlPreview')}const frame=document.getElementById('inlineHtmlFrame');if(frame)frame.srcdoc=html;wrap?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function openFile(fid=''){const f=fid?db.files.find(x=>x.id===fid):null,fileKinds=[...new Set([f?.kind,'設計原檔','Banner','DM','印刷完稿','官網HTML','FB貼文','照片','輸出檔','最終交付檔','報價／規格','其他'].filter(Boolean))];modal(f?'編輯檔案紀錄':'記錄檔案','先記下檔名與位置；之後可在專案、版本或收尾流程找到它。',`<input type="hidden" id="fileId" value="${f?.id||''}"><div class="form-grid"><div class="field"><label>檔案名稱 *</label><input id="fileName" value="${esc(f?.name||'')}" placeholder="例：中秋節_banner_desktop_v3.ai"></div><div class="field"><label>檔案類型</label><select id="fileKind">${fileKinds.map(kind=>`<option>${esc(kind)}</option>`).join('')}</select></div><div class="field"><label>版本</label><input id="fileVersion" value="${esc(f?.version||'')}" placeholder="v3"></div><div class="field"><label>狀態</label><select id="fileStatus"><option value="inbox">待分類</option><option value="working">製作中</option><option value="final">最終檔</option><option value="archived">已留存</option></select></div><div class="field full"><label>檔案位置／連結</label><input id="filePath" value="${esc(f?.path||'')}" placeholder="Google Drive 連結、資料夾路徑或檔名關鍵字"></div><div class="field"><label>關聯專案</label><select id="fileProject"><option value="">未連結</option>${options(db.projects,f?.projectId)}</select></div></div><div class="modal-foot"><button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" onclick="app.saveFile()">儲存</button></div>`);if(f){document.getElementById('fileKind').value=f.kind||'設計原檔';document.getElementById('fileStatus').value=f.status||'inbox'}}
function saveFile(){const name=document.getElementById('fileName').value.trim();if(!name)return toast('請填寫檔案名稱');const fid=document.getElementById('fileId').value,data={name,kind:document.getElementById('fileKind').value,version:document.getElementById('fileVersion').value.trim(),status:document.getElementById('fileStatus').value,path:document.getElementById('filePath').value.trim(),projectId:document.getElementById('fileProject').value};if(fid)Object.assign(db.files.find(x=>x.id===fid),data);else db.files.unshift({id:id('file'),...data,createdAt:new Date().toISOString()});save('儲存檔案紀錄');closeModal();toast('檔案紀錄已儲存')}
function openVendor(vid=''){const v=vid?vendor(vid):null;modal(v?'編輯廠商檔案':'新增廠商','記錄正式規格與實務經驗；選擇此廠商時，相關知識會自動出現。',`<input type="hidden" id="vendorId" value="${v?.id||''}"><div class="form-grid"><div class="field"><label>廠商名稱 *</label><input id="vendorName" value="${esc(v?.name||'')}" placeholder="例：○○印刷"></div><div class="field"><label>聯絡人／急件找誰</label><input id="vendorContact" value="${esc(v?.contact||'')}" placeholder="例：王小姐 LINE…"></div><div class="field"><label>一般工作天</label><input id="vendorNormal" type="number" value="${v?.normalDays||''}"></div><div class="field"><label>急件最快工作天</label><input id="vendorUrgent" type="number" value="${v?.urgentDays||''}"></div><div class="field full"><label>可接項目（逗號分隔）</label><input id="vendorCaps" value="${esc((v?.capabilities||[]).join(', '))}" placeholder="DM, 貼紙, 大圖, 帆布"></div><div class="field full"><label>官方規格／重要注意事項</label><textarea id="vendorNote">${esc(v?.note||'')}</textarea></div></div>${v?`<div class="card"><h3>已連結的工作經驗</h3><div class="list" style="margin-top:8px">${relatedKnowledge({vendorIds:[v.id]}).map(k=>`<div class="item clickable" onclick="app.openKnowledge('${k.id}')">${esc(k.title)}</div>`).join('')||'<div class="meta">尚無經驗；可從經驗收集箱把紀錄連到此廠商。</div>'}</div></div>`:''}<div class="modal-foot"><button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" onclick="app.saveVendor()">儲存</button></div>`)}
function saveVendor(){const name=document.getElementById('vendorName').value.trim();if(!name)return toast('請填寫廠商名稱');const vid=document.getElementById('vendorId').value,data={name,contact:document.getElementById('vendorContact').value.trim(),normalDays:document.getElementById('vendorNormal').value,urgentDays:document.getElementById('vendorUrgent').value,capabilities:document.getElementById('vendorCaps').value.split(',').map(x=>x.trim()).filter(Boolean),note:document.getElementById('vendorNote').value.trim(),updatedAt:new Date().toISOString()};if(vid)Object.assign(vendor(vid),data);else db.vendors.unshift({id:id('vendor'),...data});save('儲存廠商檔案');closeModal();toast('廠商檔案已儲存');setTimeout(()=>window.printApp&&printApp.syncNow(),0)}
function openKnowledge(kid=''){const k=kid?db.knowledge.find(x=>x.id===kid):null;modal(k?'整理工作經驗':'隨手記錄工作經驗','可同時連到廠商、SOP、專案；不要複製成多份。',`<input type="hidden" id="knowId" value="${k?.id||''}"><div class="field"><label>標題</label><input id="knowTitle" value="${esc(k?.title||'')}" placeholder="例：某印刷廠紅色校稿注意事項"></div><div class="field"><label>內容 *</label><textarea id="knowText" placeholder="記下當下發現、踩雷、決策或注意事項…">${esc(k?.text||'')}</textarea></div><div class="form-grid"><div class="field"><label>整理狀態</label><select id="knowStatus"><option value="inbox">待整理</option><option value="sorted">已整理</option><option value="archived">封存</option></select></div><div class="field"><label>可信度</label><select id="knowReliability"><option value="single">單次觀察</option><option value="verified">多次驗證</option><option value="official">官方規格</option></select></div><div class="field full"><label>Tag（逗號分隔）</label><input id="knowTags" value="${esc((k?.tags||[]).join(', '))}" placeholder="印刷, DM, 色彩, 急件"></div><div class="field full"><label>連結廠商</label>${checks('knowVendor',db.vendors,k?.links?.vendorIds||[])}</div><div class="field full"><label>連結專案</label>${checks('knowProject',db.projects,k?.links?.projectIds||[])}</div><div class="field full"><label>補進相關 SOP</label>${checks('knowSop',db.sops,k?.links?.sopIds||[])}</div></div><div class="modal-foot"><button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" onclick="app.saveKnowledge()">儲存整理結果</button></div>`);if(k){document.getElementById('knowStatus').value=k.status||'inbox';document.getElementById('knowReliability').value=k.reliability||'single'}}
function saveKnowledge(){const text=document.getElementById('knowText').value.trim();if(!text)return toast('請輸入內容');const kid=document.getElementById('knowId').value,data={title:document.getElementById('knowTitle').value.trim()||text.slice(0,36),text,status:document.getElementById('knowStatus').value,reliability:document.getElementById('knowReliability').value,tags:document.getElementById('knowTags').value.split(',').map(x=>x.trim()).filter(Boolean),links:{vendorIds:values('knowVendor'),projectIds:values('knowProject'),sopIds:values('knowSop')},updatedAt:new Date().toISOString()};if(kid)Object.assign(db.knowledge.find(x=>x.id===kid),data);else db.knowledge.unshift({id:id('know'),...data,priority:1,createdAt:new Date().toISOString()});save('儲存工作經驗');closeModal();toast('工作經驗已儲存')}
function openSop(sid=''){const s=sid?sop(sid):null,linked=s?relatedKnowledge({sopId:s.id}):[];modal(s?'編輯 SOP':'新增 SOP','正式 SOP 由已整理的經驗形成，可保留步驟、注意事項與關聯來源。',`<input type="hidden" id="sopId" value="${s?.id||''}"><div class="form-grid"><div class="field"><label>標題 *</label><input id="sopTitle" value="${esc(s?.title||'')}" placeholder="例：DM 印刷流程"></div><div class="field"><label>狀態</label><select id="sopStatus"><option value="draft">草稿</option><option value="verified">已驗證</option><option value="standard">正式 SOP</option></select></div><div class="field full"><label>何時使用</label><input id="sopWhen" value="${esc(s?.when||'')}" placeholder="例：每次 DM 新印或改版時"></div><div class="field full"><label>Tag（逗號分隔）</label><input id="sopTags" value="${esc((s?.tags||[]).join(', '))}"></div><div class="field full"><label>步驟（每行一個）</label><textarea id="sopSteps" placeholder="確認尺寸與出血&#10;檢查色彩模式&#10;確認數量與交期&#10;留存最終檔與樣品">${esc((s?.steps||[]).join('\n'))}</textarea></div><div class="field full"><label>正式注意事項</label><textarea id="sopNote">${esc(s?.note||'')}</textarea></div></div>${s?`<div class="card"><h3>待採納／已連結的工作經驗</h3><div class="list" style="margin-top:8px">${linked.map(k=>`<div class="item clickable" onclick="app.openKnowledge('${k.id}')"><strong>${esc(k.title)}</strong><div class="meta">${esc(k.text.slice(0,100))}</div></div>`).join('')||'<div class="meta">尚無連結經驗；可從經驗收集箱勾選此 SOP。</div>'}</div></div>`:''}<div class="modal-foot"><button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" onclick="app.saveSop()">儲存</button></div>`);if(s)document.getElementById('sopStatus').value=s.status||'draft'}
function saveSop(){const title=document.getElementById('sopTitle').value.trim();if(!title)return toast('請填寫 SOP 標題');const sid=document.getElementById('sopId').value,data={title,status:document.getElementById('sopStatus').value,when:document.getElementById('sopWhen').value.trim(),tags:document.getElementById('sopTags').value.split(',').map(x=>x.trim()).filter(Boolean),steps:document.getElementById('sopSteps').value.split('\n').map(x=>x.trim()).filter(Boolean),note:document.getElementById('sopNote').value.trim(),updatedAt:new Date().toISOString()};if(sid){const old=sop(sid);Object.assign(old,data);old.version=(old.version||1)+1}else db.sops.unshift({id:id('sop'),...data,version:1,createdAt:new Date().toISOString()});save('儲存 SOP');closeModal();toast('SOP 已儲存')}
function openRoutines(){const names={once:'單次',daily:'每日',weekly:'每週',monthly:'每月',quarterly:'每季',yearly:'每年'};modal('例行與提醒','把持續但容易漏掉的事情放在這裡；完成一次就會依正確週期排到下一次。',`<div class="section-head"><div><h2>目前例行工作</h2><small>可隨時調整下次日期與頻率。</small></div><button class="btn primary" onclick="app.openRoutine()">＋ 新增例行</button></div><div class="list">${db.routines.sort((a,b)=>(a.nextDate||'9999').localeCompare(b.nextDate||'9999')).map(r=>`<div class="item"><div class="title-line"><div><strong>${esc(r.name)}</strong><div class="tags">${tag(names[r.cycle]||r.cycle,'brand')}${r.active?tag(`下次 ${fmt(r.nextDate)}`,days(r.nextDate)<=0?'rose':'teal'):tag('已停用','gray')}</div></div><div class="row"><button class="btn small" onclick="app.openRoutine('${r.id}')">調整</button>${r.active?`<button class="btn small" onclick="app.completeRoutine('${r.id}')">完成</button>`:''}</div></div></div>`).join('')||'<div class="empty">尚無例行工作。可先建立「每週整理 SOP 收集箱」或「檢查兩個官網」。</div>'}</div>`,true)}
function openRoutine(rid=''){const r=rid?db.routines.find(x=>x.id===rid):null;modal(r?'調整例行提醒':'新增例行提醒','支援單次、每天、每週、每月、每季與每年；下次日期可以自由改。',`<input type="hidden" id="routineId" value="${r?.id||''}"><div class="form-grid"><div class="field full"><label>工作名稱 *</label><input id="routineName" value="${esc(r?.name||'')}" placeholder="例：檢查兩個官網的待確認內容"></div><div class="field"><label>頻率</label><select id="routineCycle"><option value="once">單次</option><option value="daily">每天</option><option value="weekly">每週</option><option value="monthly">每月</option><option value="quarterly">每季</option><option value="yearly">每年</option></select></div><div class="field"><label>下次執行日</label><input id="routineNext" type="date" value="${r?.nextDate||today()}"></div><div class="field"><label>狀態</label><select id="routineActive"><option value="true">啟用提醒</option><option value="false">暫停</option></select></div></div><div class="modal-foot">${r?`<button class="btn danger" onclick="app.remove('routines','${r.id}')">刪除</button>`:''}<button class="btn" onclick="app.openRoutines()">返回</button><button class="btn primary" onclick="app.saveRoutine()">儲存</button></div>`);if(r){document.getElementById('routineCycle').value=r.cycle||'weekly';document.getElementById('routineActive').value=String(r.active!==false)}}
function saveRoutine(){const name=document.getElementById('routineName').value.trim();if(!name)return toast('請填寫例行工作名稱');const rid=document.getElementById('routineId').value,data={name,cycle:document.getElementById('routineCycle').value,nextDate:document.getElementById('routineNext').value,active:document.getElementById('routineActive').value==='true',updatedAt:new Date().toISOString()};if(rid)Object.assign(db.routines.find(x=>x.id===rid),data);else db.routines.unshift({id:id('routine'),...data,createdAt:new Date().toISOString()});save('儲存例行提醒');closeModal();toast('例行提醒已儲存')}
function completeRoutine(rid){const r=db.routines.find(x=>x.id===rid);if(!r)return;const source=r.nextDate||today(),base=new Date(source+'T12:00:00');r.lastCompleted=today();if(r.cycle==='once'){r.active=false;r.completedAt=new Date().toISOString()}else if(r.cycle==='daily')base.setDate(base.getDate()+1);else if(r.cycle==='weekly')base.setDate(base.getDate()+7);else if(r.cycle==='monthly')r.nextDate=monthAdd(source,1);else if(r.cycle==='quarterly')r.nextDate=monthAdd(source,3);else if(r.cycle==='yearly')r.nextDate=monthAdd(source,12);if(r.cycle!=='once'&&!['monthly','quarterly','yearly'].includes(r.cycle))r.nextDate=base.toISOString().slice(0,10);save('完成例行工作');toast(r.cycle==='once'?'單次提醒已完成':'已排入下一次例行工作')}
function openEventV2(eid=''){const e=eid?db.events.find(x=>x.id===eid):null;const standard='桌機 Banner | 14 | 1700×730\n手機 Banner | 10 | 請填平台尺寸\nFB 圖文 | 7 | 確認文案與發布\n官網上架 | 5 | 兩站分開確認';const removeBtn=e?'<button class="btn danger" onclick="app.remove(\'events\',\''+esc(e.id)+'\')">刪除</button>':'';const learnBtn=e?'<button class="btn" onclick="app.eventToKnowledge(\''+esc(e.id)+'\')">送到經驗整理</button>':'';const body='<input type="hidden" id="eventId" value="'+esc(e?.id||'')+'"><div class="form-grid"><div class="field"><label>名稱 *</label><input id="eventName" value="'+esc(e?.name||'')+'" placeholder="例：中秋節擺攤"></div><div class="field"><label>類型</label><select id="eventType"><option value="booth">擺攤／展售</option><option value="festival">節慶 Banner</option><option value="annual">年度計畫</option></select></div><div class="field"><label>開始日</label><input id="eventStart" type="date" value="'+esc(e?.startDate||'')+'"></div><div class="field"><label>結束日</label><input id="eventEnd" type="date" value="'+esc(e?.endDate||'')+'"></div><div class="field full"><label>地點／攤位</label><input id="eventPlace" value="'+esc(e?.place||'')+'" placeholder="例：南港展覽館／攤位 Q1429"></div><div class="field full"><label>基本資訊／主辦方公告</label><textarea id="eventNote" placeholder="營業時間、地址、進撤場規則、聯絡窗口…">'+esc(e?.note||'')+'</textarea></div><div class="field full"><label>本次活動目標與促銷方案</label><textarea id="eventPromotion" placeholder="例：花醬第二件9折；滿1,500元送茶包；主推玫瑰精露。記得寫適用日期、品項、門檻與贈品數量。">'+esc(e?.promotion||'')+'</textarea></div><div class="field full"><label>現場注意事項</label><textarea id="eventOnsite" placeholder="例：插座離攤位遠、需帶延長線；下午人流較多；刷卡機訊號不穩。">'+esc(e?.onsiteNotes||'')+'</textarea></div><div class="field full"><label>活動後檢討</label><textarea id="eventReview" placeholder="例：哪個促銷有效、哪些品項缺貨、客人最常問什麼、素材是否看得懂。">'+esc(e?.reviewNotes||'')+'</textarea></div><div class="field full"><label>下次一定要沿用／避免</label><textarea id="eventNext" placeholder="只留下下次真正要提醒的結論；之後可送進經驗收集箱。">'+esc(e?.nextTimeNotes||'')+'</textarea></div><div class="field full"><label>素材與倒數任務（每行：名稱 | 天數 | 規格）</label><textarea id="eventItems">'+esc(e?.itemsText||standard)+'</textarea></div></div>'+(e?'<div class="notice">促銷屬於本次活動；可重複使用的結論請按「送到經驗整理」，之後再整理到 SOP。</div>':'')+'<div class="modal-foot">'+removeBtn+learnBtn+'<button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" onclick="app.saveEvent()">儲存'+(e?'資料':'並建立任務')+'</button></div>';modal(e?'編輯活動紀錄':'新增擺攤／節慶／年度活動','建議依序記：活動前促銷 → 現場發現 → 活動後檢討 → 下次沿用。',body,true);document.getElementById('eventType').value=e?.type||'booth'}
function syncEventTasks(event,itemsText,startDate){const rows=itemsText.split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(x=>x[0]),existing=db.tasks.filter(t=>t.eventId===event.id&&t.status!=='done');rows.forEach(parts=>{const key=parts[0],offset=Number(parts[1]||0),name=key+(parts[2]?'（'+parts[2]+'）':''),dueDate=dateAdd(startDate,-offset),phase=key.includes('FB')||key.includes('官網')?'publish':key.includes('確認')?'review':'make';let task=existing.find(t=>t.templateKey===key||t.name===name);if(task){task.name=name;task.phase=phase;task.templateKey=key;if(!task.manualDueDate)task.dueDate=dueDate;task.updatedAt=new Date().toISOString()}else db.tasks.push({id:id('task'),name,eventId:event.id,projectId:event.projectId||'',dueDate,phase,status:'open',templateKey:key,createdAt:new Date().toISOString()})})}
function saveEventV2(){const name=document.getElementById('eventName').value.trim(),startDate=document.getElementById('eventStart').value;if(!name||!startDate)return toast('請填寫名稱與開始日');const eid=document.getElementById('eventId').value,itemsText=document.getElementById('eventItems').value.trim();const data={name,type:document.getElementById('eventType').value,startDate,endDate:document.getElementById('eventEnd').value||startDate,place:document.getElementById('eventPlace').value.trim(),itemsText,note:document.getElementById('eventNote').value.trim(),promotion:document.getElementById('eventPromotion').value.trim(),onsiteNotes:document.getElementById('eventOnsite').value.trim(),reviewNotes:document.getElementById('eventReview').value.trim(),nextTimeNotes:document.getElementById('eventNext').value.trim(),updatedAt:new Date().toISOString()};let event;if(eid){event=db.events.find(x=>x.id===eid);Object.assign(event,data)}else{event={id:id('event'),...data,createdAt:new Date().toISOString()};db.events.push(event)}syncEventTasks(event,itemsText,startDate);save('儲存活動資料並同步未完成提醒');closeModal();toast(eid?'活動與提醒日期已更新':'活動與倒數任務已建立')}
function eventToKnowledge(eid){const e=db.events.find(x=>x.id===eid);if(!e)return;const sections=[];if(e.promotion)sections.push('本次促銷：\n'+e.promotion);if(e.onsiteNotes)sections.push('現場注意：\n'+e.onsiteNotes);if(e.reviewNotes)sections.push('活動後檢討：\n'+e.reviewNotes);if(e.nextTimeNotes)sections.push('下次沿用／避免：\n'+e.nextTimeNotes);if(!sections.length)return toast('請先填寫促銷、現場注意或檢討內容');const existing=db.knowledge.find(k=>k.links?.eventIds?.includes(e.id));const data={title:e.name+'｜活動經驗',text:sections.join('\n\n'),tags:['擺攤','活動檢討'],status:'inbox',priority:2,reliability:'single',links:{vendorIds:[],projectIds:[],sopIds:[],eventIds:[e.id]},updatedAt:new Date().toISOString()};if(existing)Object.assign(existing,data);else db.knowledge.unshift({id:id('know'),...data,createdAt:new Date().toISOString()});save('將活動檢討送到經驗整理');closeModal();toast('已送到經驗收集箱，可再分類到 SOP')}
function setWorkFilter(f){work.filter=f;render()}function setKnowledgeFilter(f){knowledge.filter=f;render()}
function remove(collection,rid){if(!confirm('確定刪除這筆資料？'))return;const target=db[collection].find(x=>x.id===rid);if(window.v6Cloud)window.v6Cloud.noteDeletion(collection,rid,target);if(target&&['events','products'].includes(collection)){db.deletedSeeds=db.deletedSeeds||[];[target.id,target.sourceKey].filter(Boolean).forEach(k=>{if(!db.deletedSeeds.includes(k))db.deletedSeeds.push(k)})}db[collection]=db[collection].filter(x=>x.id!==rid);save('刪除資料');closeModal();toast('已刪除')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`creative-ops-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('已匯出完整備份')}
function openImport(){modal('匯入完整備份','匯入會完全取代目前工作台資料，不會合併。',`<div class="notice">只接受本工具匯出的完整 JSON；覆蓋前會再次確認並自動備份目前資料。</div><div class="field"><label>選擇備份檔</label><input type="file" id="importFile" accept="application/json"></div><div class="meta" id="importStatus">尚未讀取檔案。</div><div class="modal-foot"><button class="btn" onclick="app.closeModal()">取消</button><button class="btn primary" id="importButton" onclick="app.importData()">讀取並匯入</button></div>`)}
function backupStats(data){return{projects:Array.isArray(data?.projects)?data.projects.length:0,orders:Array.isArray(data?.printWorkOrders)?data.printWorkOrders.length:0,knowledge:Array.isArray(data?.knowledge)?data.knowledge.length:0}}
function backupStatsText(data){const s=backupStats(data);return`${s.projects} 專案 / ${s.orders} 工單 / ${s.knowledge} 經驗`}
function validBackup(data){return Boolean(data&&data.version&&['projects','tasks','printWorkOrders','vendors','knowledge'].every(key=>Array.isArray(data[key])))}
function setImportBusy(busy,text){const button=document.getElementById('importButton'),status=document.getElementById('importStatus');if(button){button.disabled=busy;button.textContent=busy?'讀取中…':'讀取並匯入'}if(status&&text)status.textContent=text}
function importData(){const file=document.getElementById('importFile').files[0];if(!file)return toast('請選擇檔案');setImportBusy(true,'正在讀取並驗證備份檔…');const reader=new FileReader();reader.onload=()=>{let x;try{x=JSON.parse(reader.result);if(!validBackup(x))throw Error('invalid')}catch(e){setImportBusy(false,'檔案驗證失敗，目前資料未變動。');toast('這不是有效的備份檔（缺少必要資料），目前資料未變動。',6500);return}const currentText=backupStatsText(db),fileText=backupStatsText(x);if(!confirm(`⚠ 這會用檔案內容「完全取代」目前所有資料，不會合併。\n目前：${currentText}\n檔案：${fileText}\n系統會先自動備份目前資料。確定覆蓋？`)){setImportBusy(false,'已取消匯入，目前資料未變動。');return}const originalDb=db;let replaced=false;try{const before=JSON.parse(localStorage.getItem('creative_ops_v6_snapshots')||'[]')[0]?.id||'';if(window.v6BeforeSave)window.v6BeforeSave(db,'匯入前自動備份目前資料');const after=JSON.parse(localStorage.getItem('creative_ops_v6_snapshots')||'[]')[0];if(!after||after.id===before)throw Error('snapshot');db=x;replaced=true;Object.keys(defaults()).forEach(k=>db[k]??=defaults()[k]);if(window.v6App?.migrateData)window.v6App.migrateData(false);save('套用已驗證備份資料');closeModal();toast(`已匯入：${fileText}。原資料已備份，可到「備份與紀錄」還原。`,6500)}catch(e){if(replaced){db=originalDb;try{localStorage.setItem(KEY,JSON.stringify(originalDb))}catch(rollbackError){console.error('匯入失敗後回復原資料時發生錯誤',rollbackError)}}setImportBusy(false,e.message==='snapshot'?'匯入前備份失敗，已停止匯入。':'匯入失敗，目前資料未變動。');toast(e.message==='snapshot'?'無法建立匯入前備份，已停止匯入；目前資料未變動。':'匯入失敗，目前資料未變動。',6500)}};reader.onerror=()=>{setImportBusy(false,'檔案讀取失敗，目前資料未變動。');toast('檔案讀取失敗，目前資料未變動。',6500)};reader.readAsText(file)}
function seedDemo(){if(db.projects.length||db.vendors.length||db.events.length){if(!confirm('載入示範資料會保留既有資料並加入範例，確定嗎？'))return}const v={id:id('vendor'),name:'範例印刷廠',contact:'王小姐／急件請先 LINE',normalDays:3,urgentDays:1,capabilities:['DM','貼紙','大圖'],note:'重要紅色請先校稿。'};db.vendors.push(v);const p={id:id('proj'),name:'中秋節擺攤宣傳',stage:'active',priority:'high',dueDate:dateAdd(today(),12),brief:'Banner、DM、官網與 FB 需同步完成。',vendorIds:[v.id],createdAt:new Date().toISOString()};db.projects.push(p);db.tasks.push({id:id('task'),name:'確認桌機 Banner 1700×730',projectId:p.id,eventId:'',dueDate:dateAdd(today(),2),phase:'review',status:'open'});db.confirmations.push({id:id('confirm'),question:'確認 DM 數量與交期',person:'業務窗口',projectId:p.id,status:'asked',nextFollowup:today(),result:''});db.knowledge.push({id:id('know'),title:'範例印刷經驗：紅色校稿',text:'範例印刷廠的紅色容易偏暗，重要紅色要先校稿。',tags:['印刷','DM','色彩'],status:'inbox',priority:2,reliability:'single',links:{vendorIds:[v.id],projectIds:[p.id],sopIds:[]}});db.events.push({id:id('event'),name:'中秋節市集',type:'booth',startDate:dateAdd(today(),20),endDate:dateAdd(today(),22),place:'範例展館／攤位待確認',itemsText:'',note:''});db.routines.push({id:id('routine'),name:'每週整理 SOP 收集箱',cycle:'weekly',nextDate:today(),active:true});save('載入示範資料');toast('示範資料已加入')}
return{render,openModal:modal,closeModal,requestModalTransition,requestCloseModal,scheduleModalCallback,modalHasUnsavedChanges,setModalBusy,isModalBusy,isModalInstance,lastSaveFailed,toggleMobileNav,goHome,openView,openCapture,setCaptureDate,saveCapture,openProject,saveProject,openTask,saveTask,toggleTask,openConfirmation,saveConfirmation,openEvent:openEventV2,saveEvent:saveEventV2,eventToKnowledge,openWebsite,saveWebsite,openWebChange,saveWebChange,previewHtml,openFile,saveFile,openVendor,saveVendor,openKnowledge,saveKnowledge,openSop,saveSop,openRoutines,openRoutine,saveRoutine,completeRoutine,setTaskFilter,setTaskSearch,setWorkFilter,setKnowledgeFilter,remove,exportData,openImport,importData,seedDemo,getData:()=>db,saveData:save};
})();
